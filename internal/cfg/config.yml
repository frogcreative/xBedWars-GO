  bed-destroyed: "&l&fBED DESTRUCTION > &r{teamcolor}{team} Bed &7was destroyed by {playercolor}{player}&7!"
  victory-title: "&l&6VICTORY"
  respawned-title: "&aRESPAWNED!"
