# NewBedwars configuration
# This file is copied into plugin_data/NewBedwars/config.yml the first time
# the plugin runs. Edit it there, then restart (or /newbedwars reload if
# available) to apply changes. Color codes use "&" (e.g. &e = yellow).
# Placeholders inside a message ({player}, {team}, {seconds}, ...) are filled
# in automatically - only edit the text around them.

config-version: 1

game:
  # Server address shown on the waiting-lobby scoreboard.
  server-ip: "play.youripaddress.com"

  timers:
    # Seconds the lobby countdown starts from once enough players have joined.
    lobby-countdown: 20
    # Seconds between each generator tier upgrade (Diamond II/III, Emerald II/III).
    upgrade-interval: 300
    # Seconds after game start until beds are destroyed automatically.
    bed-destroy-time: 600
    # Seconds after beds are gone until Sudden Death starts.
    sudden-death-time: 600
    # Seconds after Sudden Death starts until the game is declared a draw.
    game-over-time: 600
    # Seconds the "restarting arena" countdown takes after a game ends.
    restart-time: 10

  dragon:
    # How far (in blocks) the Sudden Death dragon can roam from the map's
    # center point before it re-picks a target to fly toward. On very large
    # maps this may need to be raised so it can actually reach every island.
    max-distance-from-mid: 100

  generator:
    # Seconds between each resource drop from the Iron/Gold generators on
    # every team's own island (not the shared Diamond/Emerald generators).
    # Lower = faster resource income for every team.
    iron-interval: 2
    gold-interval: 6

  egg-bridge:
    # Throw strength for the Bridge Egg item - higher throws it further.
    throw-power: 1.5
    # Ticks (20 = 1 second) the egg can fly before its wool trail is placed
    # regardless of whether it hit a block - this is what makes the bridge
    # still appear even when the egg is thrown into a void.
    max-age-ticks: 60

  explosives:
    tnt:
      # Explosion radius passed to pmmp's own explosion/block-breaking logic.
      # Smaller also means less of pmmp's built-in vanilla explosion damage.
      radius: 3
      # Extra flat damage (in half-hearts) dealt directly to any player caught
      # within damage-range, on top of pmmp's own explosion damage - lowering
      # this (and/or damage-range) is the main way to make TNT less deadly.
      direct-damage: 2
      # Blocks - how far from the explosion the flat direct-damage above still
      # applies.
      damage-range: 6
      # Knockback strength applied to players caught in damage-range.
      knockback: 2
    fireball:
      radius: 3
      direct-damage: 2
      damage-range: 6
      knockback: 2

scoreboard:
  title: "&l&eBED WARS"
  unicode:
    # Symbol shown after the health number under a player's nametag.
    health-symbol: ""
    # Symbol shown next to a team's name on the in-game scoreboard while
    # their bed is still standing.
    team-bed-alive: ""
    # Symbol shown next to a team's name once that team is fully eliminated.
    team-eliminated: ""
  lobby-lines:
    map: "&fMap: &a{map}"
    players: "&fPlayers: &a{count}/{max}"
    starting-in: "&fStarting in: &a{time}s"
    waiting: "&fWaiting..."
    mode: "&fMode: &a{mode}"
  game-lines:
    diamond-2-in: "&fDiamond II in: &a{time}"
    emerald-2-in: "&fEmerald II in: &a{time}"
    diamond-3-in: "&fDiamond III in: &a{time}"
    emerald-3-in: "&fEmerald III in: &a{time}"
    bed-gone-in: "&fBed gone in: &a{time}"
    sudden-death-in: "&fSudden Death in: &a{time}"
    game-end-in: "&fGame End in: &a{time}"
    kills: "Kills: &a{kills}"
    final-kills: "Final Kills: &a{kills}"
    beds-broken: "Beds Broken: &a{count}"

